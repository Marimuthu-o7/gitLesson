<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Date</h1>
    <p>Today's date is: <span id="currentDate"></span></p>
    <p><time id="currentTime"></time></p>

    <script>
        const today = new Date();
        document.getElementById("currentDate").textContent = today.toLocaleDateString();
        document.getElementById("currentTime").textContent = today.toLocaleTimeString();
    </script>   
</body>
</html>
